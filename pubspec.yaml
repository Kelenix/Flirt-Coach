name: flirt_coach
description: "Flirt Coach - coach de drague et messages"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.4
  purchases_flutter: 11.0.2
  google_mobile_ads: 9.2.0
  cupertino_icons: ^1.0.9
  lucide_icons_flutter: 4.0.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo_symbol.png
    - assets/images/logo_wordmark_dark.png
    - assets/images/logo_horizontal_dark.png
    - assets/legal/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Icône d'application (kit de marque) : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
