<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="titre desc">
  <title id="titre">Architecture de Flirt Coach Pro</title>
  <desc id="desc">L'application Flutter parle à Supabase (authentification anonyme, Edge Functions, Postgres protégé par RLS). Les Edge Functions appellent Claude ; RevenueCat et AdMob confirment achats et récompenses au serveur.</desc>
  <defs>
    <radialGradient id="halo-violet" cx="8%" cy="0%" r="60%">
      <stop offset="0" stop-color="#9B5CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-rose" cx="96%" cy="4%" r="50%">
      <stop offset="0" stop-color="#FF4D79" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FF4D79" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D79"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4A3FF"/>
    </marker>
    <marker id="fleche-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF8FAB"/>
    </marker>
  </defs>

  <style>
    .titre { font-family: Poppins, "Segoe UI", Arial, sans-serif; font-size: 15.5px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
    .detail { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #CFC6E6; text-anchor: middle; }
    .groupe { font-family: Poppins, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 2px; fill: #FFB3C7; }
    .lien { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #FFB3C7; text-anchor: middle; }
    .interne { fill: #2A1D4A; stroke: url(#marque); stroke-width: 1.5; }
    .externe { fill: #FF4D79; fill-opacity: 0.10; stroke: #FF4D79; stroke-width: 1.5; }
    .cadre { fill: #FFFFFF; fill-opacity: 0.03; stroke: #FFFFFF; stroke-opacity: 0.14; }
    .trait { stroke: #C4A3FF; stroke-width: 2; fill: none; marker-end: url(#fleche); }
    .sdk { stroke: #FF8FAB; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#fleche-rose); }
    .fond-lien { fill: #1A1033; }
  </style>

  <rect width="1120" height="610" rx="26" fill="#1A1033"/>
  <rect width="1120" height="610" rx="26" fill="url(#halo-violet)"/>
  <rect width="1120" height="610" rx="26" fill="url(#halo-rose)"/>

  <!-- Téléphone -->
  <rect class="cadre" x="24" y="64" width="280" height="392" rx="22"/>
  <text class="groupe" x="44" y="96">TÉLÉPHONE</text>

  <rect class="interne" x="48" y="116" width="232" height="96" rx="16"/>
  <text class="titre" x="164" y="158">Application Flutter</text>
  <text class="detail" x="164" y="184">Riverpod · go_router · freezed</text>

  <rect class="interne" x="48" y="236" width="232" height="80" rx="16"/>
  <text class="titre" x="164" y="270">Stockage sécurisé</text>
  <text class="detail" x="164" y="294">session · Keychain / Keystore</text>

  <rect class="interne" x="48" y="340" width="232" height="92" rx="16"/>
  <text class="titre" x="164" y="380">SDK achats et publicités</text>
  <text class="detail" x="164" y="406">RevenueCat · Google AdMob</text>

  <!-- Supabase -->
  <rect class="cadre" x="408" y="64" width="304" height="392" rx="22"/>
  <text class="groupe" x="428" y="96">SUPABASE · UE</text>

  <rect class="interne" x="432" y="116" width="256" height="76" rx="16"/>
  <text class="titre" x="560" y="150">Auth anonyme</text>
  <text class="detail" x="560" y="174">session sans inscription</text>

  <rect class="interne" x="432" y="216" width="256" height="96" rx="16"/>
  <text class="titre" x="560" y="256">Edge Functions (Deno)</text>
  <text class="detail" x="560" y="282">IA · webhooks · suppression de compte</text>

  <rect class="interne" x="432" y="340" width="256" height="92" rx="16"/>
  <text class="titre" x="560" y="380">Postgres + RLS</text>
  <text class="detail" x="560" y="406">crédits · historique · droits Premium</text>

  <!-- Services externes -->
  <text class="groupe" x="816" y="96">SERVICES EXTERNES</text>

  <rect class="externe" x="816" y="216" width="280" height="96" rx="16"/>
  <text class="titre" x="956" y="256">Claude · Anthropic</text>
  <text class="detail" x="956" y="282">rédaction des réponses</text>

  <rect class="externe" x="816" y="336" width="280" height="80" rx="16"/>
  <text class="titre" x="956" y="370">RevenueCat</text>
  <text class="detail" x="956" y="394">achats confirmés par webhook signé</text>

  <rect class="externe" x="816" y="448" width="280" height="80" rx="16"/>
  <text class="titre" x="956" y="482">Google AdMob</text>
  <text class="detail" x="956" y="506">récompenses par rappel signé (SSV)</text>

  <!-- Flux -->
  <line class="trait" x1="280" y1="146" x2="430" y2="154"/>
  <rect class="fond-lien" x="295" y="125" width="118" height="18" rx="6"/>
  <text class="lien" x="354" y="138">connexion anonyme</text>

  <line class="trait" x1="280" y1="184" x2="430" y2="258"/>
  <rect class="fond-lien" x="295" y="209" width="118" height="18" rx="6"/>
  <text class="lien" x="354" y="222">appels IA · jeton</text>

  <line class="trait" x1="280" y1="200" x2="430" y2="372"/>
  <rect class="fond-lien" x="295" y="277" width="118" height="18" rx="6"/>
  <text class="lien" x="354" y="290">lectures sous RLS</text>

  <line class="trait" x1="560" y1="312" x2="560" y2="338"/>
  <text class="lien" x="572" y="330" style="text-anchor: start">écritures serveur</text>

  <line class="trait" x1="688" y1="264" x2="814" y2="264"/>
  <text class="lien" x="751" y="254">consignes + texte</text>

  <line class="trait" x1="816" y1="372" x2="690" y2="290"/>
  <line class="trait" x1="816" y1="484" x2="690" y2="302"/>

  <path class="sdk" d="M164 432 V572 H1108 V376 H1098"/>
  <path class="sdk" d="M1108 488 H1098"/>
  <rect class="fond-lien" x="522" y="563" width="236" height="18" rx="6"/>
  <text class="lien" x="640" y="576">achats et vidéos (SDK de l'application)</text>
</svg>
